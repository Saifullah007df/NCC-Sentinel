{% extends 'base.html' %}{% block content %}<section class="auth card"><div class="eyebrow">PHONE VERIFICATION</div><h1>Verify your mobile number</h1><p>Enter the six-digit registration code sent to your phone. It expires after five minutes. Administrator approval is still required.</p><form method="post" action="/verify-registration"><label>Registration code<input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button class="primary full">Verify phone and submit registration</button></form><p class="center"><a href="/register">Start a new registration</a></p></section>{% endblock %}
