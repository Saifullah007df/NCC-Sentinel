{% extends 'base.html' %}{% block content %}<section class="auth card"><div class="eyebrow">CADET REGISTRATION</div><h1>Create your account</h1><p>An administrator must approve your account before you can sign in.</p><form method="post" action="/register"><label>Full name<input name="name" required maxlength="90"></label><label>Regimental number<input name="reg_no" required maxlength="40"></label><label>Mobile number (international format)<input name="phone" required placeholder="+919876543210" pattern="\+[0-9]{9,15}"></label><label>Password (12+ characters)<input type="password" name="password" required minlength="12" autocomplete="new-password"></label><button class="primary full">Register</button></form><p class="center"><a href="/login">Already registered? Sign in</a></p></section>{% endblock %}
